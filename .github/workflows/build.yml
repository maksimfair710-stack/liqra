name: Build LIQRA Browser for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'main.js'
      - 'preload.js'
      - 'index.html'
      - 'renderer.js'
      - 'style.css'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LIQRA-Browser-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
